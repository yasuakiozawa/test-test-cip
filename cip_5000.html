<!DOCTYPE html>

            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .option-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.985);
        }

            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }

            animation: fadeIn 0.25s ease-out forwards;

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-teal-600 selection:text-white">

                </h2>
                <button onclick="app.toggleStatsModal()" class="text-slate-300 hover:text-white p-1">

                </button>

            </div>

    // =========================================================================

    // =========================================================================
    // 2. 5,000問生成エンジン（バリエーション・引っかけ・数値・症例問題展開）
    // =========================================================================
    class QuestionBankEngine {
        constructor() {
            this.totalCount = 5000;
            this.questions = [];
            this.build5000Questions();
        }

        // 決定論的疑似乱数生成器（シード固定により問題番号と進捗が一致）
        mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        build5000Questions() {
            const rng = this.mulberry32(20260501); // CIP 2026教材シード

            // 追加の動的テンプレート群（抗体価判定、感染症法分類、生存期間、計算問題など）
            const dynamicTemplates = this.createDynamicTemplates();
            const allTemplates = [...BASE_FACTS, ...dynamicTemplates];

            // 問いかけフレーズバリエーション（試験本番の多様な出題形式に対応）
            const stemsStandard = [
                '',
                '日本環境感染学会の認定制度教材の記載に基づき、次の中から最も適切なものを1つ選べ。\n',
                'CIP認定試験対策：以下の記述のうち、正しいものはどれか。\n',
                '感染管理実践者（CIP）としての判断として、最も妥当なものはどれか。\n',
                '標準的な感染管理の知識として、教材の内容に合致するものはどれか。\n'
            ];
            const stemsTrap = [
                '',
                '【ひっかけ注意・頻出】誤った選択肢に惑わされないよう注意して、正しいものを1つ選べ。\n',
                '【試験重要ポイント】現場で誤解されやすい点を含む設問である。最も適切なものはどれか。\n',
                '【臨床判断・引っかけ】細部の基準や例外規定に注意して、正しい記述を選べ。\n'
            ];

            for (let i = 0; i < this.totalCount; i++) {
                // テンプレートを循環＋ランダム選択
                const baseIdx = i < allTemplates.length
                    ? i
                    : Math.floor(rng() * allTemplates.length);
                const tpl = allTemplates[baseIdx];

                // 選択肢のシャッフル（正解インデックスを追跡）
                const indexedOptions = tpl.options.map((text, idx) => ({
                    text,
                    isCorrect: idx === tpl.ans
                }));

                for (let j = indexedOptions.length - 1; j > 0; j--) {
                    const k = Math.floor(rng() * (j + 1));
                    [indexedOptions[j], indexedOptions[k]] = [indexedOptions[k], indexedOptions[j]];
                }

                const newAns = indexedOptions.findIndex(o => o.isCorrect);

                // 問題文に自然なバリエーションを付与（重複感をなくし実践力を養う）
                let questionText = tpl.q;
                if (i >= allTemplates.length) {
                    const pool = tpl.type === 'trap' ? stemsTrap : stemsStandard;
                    const prefix = pool[Math.floor(rng() * pool.length)];
                    if (prefix && !questionText.startsWith('【')) {
                        questionText = prefix + questionText;
                    }
                }

                this.questions.push({
                    id: i + 1,
                    cat: tpl.cat,
                    type: tpl.type,
                    q: questionText,
                    options: indexedOptions.map(o => o.text),
                    ans: newAns,
                    exp: tpl.exp
                });
            }
        }

        // 教材内の全表・数値・個別疾患・法律データを網羅する動的問題群
        createDynamicTemplates() {
            const list = [];

                                            <i class="fa-solid ${cat.icon} text-lg"></i>
                                        </div>
                                        <div class="min-w-0">
                                            <div class="flex items-center space-x-2">
                                                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${cat.code}</span>
                                                <span class="text-[11px] font-bold text-slate-400">収録 ${catQuestions.length}問</span>
                                            </div>
                                            <div class="text-sm sm:text-base font-extrabold text-slate-800 truncate mt-0.5">${cat.name}</div>
                                            <div class="flex items-center space-x-2 mt-1">
                                                <div class="w-24 bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                    <div class="bg-${cat.color}-500 h-full" style="width: ${pct}%"></div>
                                                </div>
                                                <span class="text-[11px] font-bold text-slate-500">済 ${catAnswered} / 正解 ${catCorrect}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="ml-2 text-slate-400">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </div>
                                </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // クイズセッションの開始
        startQuiz(mode, catId = null, startQId = 1) {
            let pool = [];
            if (mode === 'category') {
                pool = this.engine.questions.filter(q => q.cat === catId);
            } else if (mode === 'trap') {
                pool = this.engine.questions.filter(q => q.type === 'trap' || q.type === 'numeric');
            } else if (mode === 'wrong') {
                pool = this.engine.questions.filter(q => this.progress[q.id] && !this.progress[q.id].isCorrect);
            } else if (mode === 'sequential') {
                pool = [...this.engine.questions];
            } else {
                // 'all': 未回答を優先しつつシャッフル
                const unanswered = this.engine.questions.filter(q => !this.progress[q.id]);
                const answered = this.engine.questions.filter(q => this.progress[q.id]);
                pool = [...this.shuffleArray(unanswered), ...this.shuffleArray(answered)];
            }

            if (mode === 'category' || mode === 'trap') {
                // 未回答を先頭にシャッフル
                const unanswered = pool.filter(q => !this.progress[q.id]);
                const answered = pool.filter(q => this.progress[q.id]);
                pool = [...this.shuffleArray(unanswered), ...this.shuffleArray(answered)];
            }

            if (pool.length === 0) {
                this.showMessageDialog('お知らせ', '該当する問題がありません。別のモードをお試しください。');
                return;
            }

            let startIndex = 0;
            if (mode === 'sequential' && startQId > 1) {
                const foundIdx = pool.findIndex(q => q.id === startQId);
                if (foundIdx !== -1) startIndex = foundIdx;
            }

            this.currentSession = {
                mode,
                catId,
                queue: pool,
                currentIndex: startIndex,
                selectedOption: null,
                isSubmitted: false
            };

            this.renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        jumpToQuestion() {
            const input = document.getElementById('jump-q-input');
            const val = parseInt(input.value, 10);
            if (isNaN(val) || val < 1 || val > 5000) {
                this.showMessageDialog('入力エラー', '1 〜 5000 の間の問題番号を入力してください。');
                return;
            }
            this.startQuiz('sequential', null, val);
        }

        shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // 問題画面の描画
        renderQuestion() {
            const sess = this.currentSession;
            const qObj = sess.queue[sess.currentIndex];
            const catInfo = CATEGORIES.find(c => c.id === qObj.cat);
            const labels = ['A', 'B', 'C', 'D'];

            // バッジ表示
            let typeBadge = `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">標準問題</span>`;
            if (qObj.type === 'trap') {
                typeBadge = `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300"><i class="fa-solid fa-triangle-exclamation mr-1"></i>引っかけ注意</span>`;
            } else if (qObj.type === 'numeric') {
                typeBadge = `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200"><i class="fa-solid fa-calculator mr-1"></i>数値・基準判定</span>`;
            }

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex-1 flex flex-col justify-between animate-fade-in pb-6">
                    <div class="space-y-4">
                        <!-- 上部ナビゲーションバー -->
                        <div class="flex items-center justify-between bg-white px-3.5 py-2.5 rounded-2xl border border-slate-200/80 shadow-2xs">
                            <button onclick="app.goHome()" class="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1 py-1 px-2 rounded-lg hover:bg-slate-100 transition">
                                <i class="fa-solid fa-arrow-left"></i> 一覧へ
                            </button>
                            <div class="text-xs font-extrabold text-slate-700">
                                問題 <span class="text-teal-700 text-sm">No.${String(qObj.id).padStart(4, '0')}</span>
                                <span class="text-slate-400 font-normal ml-1">(${sess.currentIndex + 1} / ${sess.queue.length})</span>
                            </div>
                            <div>${typeBadge}</div>
                        </div>

                        <!-- 問題文カード -->
                        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/90">
                            <div class="flex items-center space-x-2 mb-3">
                                <span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-${catInfo.color}-50 text-${catInfo.color}-700 border border-${catInfo.color}-200">
                                    ${catInfo.code}
                                </span>
                                <span class="text-xs font-bold text-slate-500 truncate">${catInfo.name}</span>
                            </div>
                            <p class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed whitespace-pre-line">${this.escapeHtml(qObj.q)}</p>
                        </div>

                        <!-- 4択選択肢リスト -->
                        <div class="space-y-2.5" id="options-container">
                            ${qObj.options.map((opt, idx) => {
                                let btnClass = 'bg-white border-slate-200 hover:border-teal-400 hover:bg-teal-50/30 text-slate-800';
                                let badgeClass = 'bg-slate-100 text-slate-600 border-slate-200';
                                let statusIcon = '';

                                if (sess.isSubmitted) {
                                    if (idx === qObj.ans) {
                                        btnClass = 'bg-emerald-50 border-emerald-500 ring-2 ring-emerald-500/20 text-emerald-950';
                                        badgeClass = 'bg-emerald-600 text-white border-emerald-600';
                                        statusIcon = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl ml-2 shrink-0"></i>';
                                    } else if (idx === sess.selectedOption) {
                                        btnClass = 'bg-rose-50 border-rose-500 ring-2 ring-rose-500/20 text-rose-950';
                                        badgeClass = 'bg-rose-600 text-white border-rose-600';
                                        statusIcon = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl ml-2 shrink-0"></i>';
                                    } else {
                                        btnClass = 'bg-white/60 border-slate-200 text-slate-400 opacity-75';
                                    }
                                }

                                return `
                                <button onclick="app.selectOption(${idx})" ${sess.isSubmitted ? 'disabled' : ''}
                                    class="option-btn w-full p-3.5 sm:p-4 rounded-2xl border-2 text-left flex items-center justify-between shadow-2xs ${btnClass}">
                                    <div class="flex items-start space-x-3">
                                        <span class="w-7 h-7 rounded-lg border text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5 ${badgeClass}">
                                            ${labels[idx]}
                                        </span>
                                        <span class="text-sm sm:text-base font-bold leading-snug">${this.escapeHtml(opt)}</span>
                                    </div>
                                    ${statusIcon}
                                </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- 解説エリア（回答後に自動展開） -->
                        ${sess.isSubmitted ? this.renderExplanationBox(qObj, sess.selectedOption === qObj.ans, labels) : ''}
                    </div>

                    <!-- 下部コントロールバー -->
                    <div class="mt-6 pt-3 border-t border-slate-200/80 flex items-center justify-between gap-3">
                        <button onclick="app.prevQuestion()" ${sess.currentIndex === 0 ? 'disabled' : ''}
                            class="px-4 py-3 rounded-xl font-bold text-sm border border-slate-300 bg-white text-slate-700 disabled:opacity-40 hover:bg-slate-50 transition">
                            <i class="fa-solid fa-chevron-left mr-1"></i> 前へ
                        </button>

                        ${sess.isSubmitted ? `
                            <button onclick="app.nextQuestion()"
                                class="flex-1 py-3.5 px-6 rounded-xl font-extrabold text-base bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-md hover:shadow-lg active:scale-[0.99] transition flex items-center justify-center gap-2">
                                <span>次の問題へ</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        ` : `
                            <div class="flex-1 text-center text-xs font-bold text-slate-400">
                                選択肢をタップすると即座に正誤と解説を表示します
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // 正誤に関わらず表示される詳細解説ボックス
        renderExplanationBox(qObj, isCorrect, labels) {
            return `
                <div id="explanation-panel" class="rounded-2xl overflow-hidden border-2 ${isCorrect ? 'border-emerald-500 bg-emerald-50/40' : 'border-rose-500 bg-rose-50/40'} shadow-sm animate-fade-in">
                    <div class="px-4 py-3 ${isCorrect ? 'bg-emerald-600' : 'bg-rose-600'} text-white flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} text-xl"></i>
                            <span class="font-black text-base tracking-wide">${isCorrect ? '正解！' : '不正解…'}</span>
                        </div>
                        <span class="text-xs font-extrabold bg-white/20 px-2.5 py-1 rounded-lg">
                            正解：${labels[qObj.ans]}
                        </span>
                    </div>
                    <div class="p-4 sm:p-5 bg-white">
                        <div class="text-xs font-extrabold text-teal-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                            <i class="fa-solid fa-book-open"></i> 添付教材に基づく解説・根拠
                        </div>
                        <p class="text-sm sm:text-base text-slate-800 leading-relaxed font-medium">
                            ${this.escapeHtml(qObj.exp)}
                        </p>
                    </div>
                </div>
            `;
        }

        // 選択肢タップ時の処理
        selectOption(idx) {
            const sess = this.currentSession;
            if (sess.isSubmitted) return;

            const qObj = sess.queue[sess.currentIndex];
            const isCorrect = idx === qObj.ans;

            sess.selectedOption = idx;
            sess.isSubmitted = true;

            // 学習履歴に保存
            this.progress[qObj.id] = {
                answered: true,
                isCorrect: isCorrect,
                selected: idx
            };

            this.renderQuestion();

            // スマホ画面で解説が見やすい位置へスムーズスクロール
            setTimeout(() => {
                const expEl = document.getElementById('explanation-panel');
                if (expEl) {
                    expEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 80);
        }

        nextQuestion() {
            const sess = this.currentSession;
            if (sess.currentIndex + 1 < sess.queue.length) {
                sess.currentIndex++;
                sess.selectedOption = null;
                sess.isSubmitted = false;
                this.renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                this.showMessageDialog('セット完了', '選択した問題セットをすべて完了しました！ホーム画面に戻ります。', () => {
                    this.goHome();
                });
            }
        }

        prevQuestion() {
            const sess = this.currentSession;
            if (sess.currentIndex > 0) {
                sess.currentIndex--;
                const prevQ = sess.queue[sess.currentIndex];
                const prevRecord = this.progress[prevQ.id];
                if (prevRecord) {
                    sess.selectedOption = prevRecord.selected;
                    sess.isSubmitted = true;
                } else {
                    sess.selectedOption = null;
                    sess.isSubmitted = false;
                }
                this.renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        goHome() {
            this.renderHome();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 成績モーダルの表示切替
        toggleStatsModal() {
            const modal = document.getElementById('stats-modal');
            if (modal.classList.contains('hidden')) {
                this.renderStatsModal();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        renderStatsModal() {
            const body = document.getElementById('stats-modal-body');
            const total = this.engine.totalCount;
            const answeredIds = Object.keys(this.progress);
            const answeredCount = answeredIds.length;
            const correctCount = answeredIds.filter(id => this.progress[id].isCorrect).length;
            const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            body.innerHTML = `
                <div class="bg-teal-50 border border-teal-200 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <div class="text-xs font-bold text-teal-800">現在の通算正答率</div>
                        <div class="text-2xl font-black text-teal-900 mt-0.5">${rate}% <span class="text-xs font-bold text-teal-700">(${correctCount} / ${answeredCount}問)</span></div>
                    </div>
                    <div class="text-right text-xs font-bold text-teal-800">
                        残り未演習<br><span class="text-base font-black">${(total - answeredCount).toLocaleString()}</span> 問
                    </div>
                </div>

                <div class="space-y-2.5">
                    <div class="text-xs font-extrabold text-slate-500 uppercase">分野別達成度</div>
                    ${CATEGORIES.map(cat => {
                        const qs = this.engine.questions.filter(q => q.cat === cat.id);
                        const ans = qs.filter(q => this.progress[q.id]).length;
                        const cor = qs.filter(q => this.progress[q.id]?.isCorrect).length;
                        const catRate = ans > 0 ? Math.round((cor / ans) * 100) : 0;
                        return `
                            <div class="p-3 rounded-xl border border-slate-200 bg-slate-50/50">
                                <div class="flex justify-between items-center text-xs font-bold mb-1">
                                    <span class="text-slate-800 truncate pr-2">${cat.code} ${cat.name}</span>
                                    <span class="text-teal-700 shrink-0">${cor}/${ans}問 (${catRate}%)</span>
                                </div>
                                <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-teal-600 h-full" style="width: ${catRate}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        confirmResetProgress() {
            this.showMessageDialog(
                '学習記録のリセット',
                'これまでの解答履歴と正答率データをすべて消去して0問目からやり直しますか？',
                () => {
                    this.progress = {};
                    this.toggleStatsModal();
                    this.renderHome();
                },
                true
            );
        }

        // カスタムダイアログ（alert / confirm 代替）
        showMessageDialog(title, message, onOk = null, showCancel = false) {
            const dialog = document.getElementById('custom-dialog');
            document.getElementById('dialog-title').textContent = title;
            document.getElementById('dialog-message').textContent = message;

            const cancelBtn = document.getElementById('dialog-cancel');
            const okBtn = document.getElementById('dialog-ok');

            if (showCancel) {
                cancelBtn.classList.remove('hidden');
            } else {
                cancelBtn.classList.add('hidden');
            }

            const close = () => dialog.classList.add('hidden');
            cancelBtn.onclick = close;
            okBtn.onclick = () => {
                close();
                if (onOk) onOk();
            };

            dialog.classList.remove('hidden');
        }

        escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    }

    // ウィンドウロード完了後にアプリを起動
    window.addEventListener('DOMContentLoaded', () => {
        window.app = new CIPStudyApp();
    });
    </script>
</body>
</html>
